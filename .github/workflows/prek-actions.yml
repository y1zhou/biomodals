name: Backend checks
on: [pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: j178/prek-action@v1
        with:
          extra-args: >-
            --from-ref ${{ github.event.pull_request.base.sha }}
            --to-ref ${{ github.event.pull_request.head.sha }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: '3.12'
      - name: Verify the committed lockfile
        run: uv lock --check
      - name: Run tests
        run: uv run --frozen pytest -q
      - name: Export inherited image requirements and declared RNA sources
        run: |
          uv run --frozen python examples/validation/runtime_requirements.py > "$RUNNER_TEMP/runtime-requirements.txt"
          uv run --frozen python examples/validation/runtime_requirements.py --relax-versions > "$RUNNER_TEMP/rna-requirements.txt"
          uv run --frozen python examples/validation/stage_rna_runtime.py "$RUNNER_TEMP/rna-sources"
      - name: Verify Python 3.10 RNA request and plan transport
        run: |
          for app in oligoformer ensirna; do
            PYTHONPATH="$RUNNER_TEMP/rna-sources/$app" \
              uv run --no-project --python 3.10 \
              --with-requirements "$RUNNER_TEMP/rna-requirements.txt" \
              python examples/validation/rna_runtime.py "$app" "runtime-evidence/python310/$app"
          done
      - name: Verify Python 3.11 task-image imports
        run: >-
          PYTHONPATH=src uv run --no-project --python 3.11
          --with-requirements "$RUNNER_TEMP/runtime-requirements.txt"
          python -c
          'import biomodals.app.design.ligandmpnn_app;
          import biomodals.workflow.ppiflow.ligandmpnn_runtime;
          import biomodals.app.fold.flowpacker_app'
      - name: Verify Python 3.11 RNA request and plan transport
        run: |
          for app in oligoformer ensirna; do
            PYTHONPATH="$RUNNER_TEMP/rna-sources/$app" \
              uv run --no-project --python 3.11 \
              --with-requirements "$RUNNER_TEMP/runtime-requirements.txt" \
              python examples/validation/rna_runtime.py "$app" "runtime-evidence/python311/$app"
          done
      - name: Retain runtime verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-verification
          path: runtime-evidence/
          if-no-files-found: warn
