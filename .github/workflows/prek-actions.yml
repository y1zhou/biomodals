name: Backend checks
on: [pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: j178/prek-action@v1
        with:
          extra-args: >-
            --from-ref ${{ github.event.pull_request.base.sha }}
            --to-ref ${{ github.event.pull_request.head.sha }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: '3.12'
      - name: Verify the committed lockfile
        run: uv lock --check
      - name: Run tests
        run: uv run --frozen pytest -q
      - name: Verify Python 3.11 task-image imports
        run: >-
          PYTHONPATH=src uv run --no-project --python 3.11
          --with 'modal>=1.5.1'
          --with 'orjson>=3.11.8'
          --with 'pydantic>=2.12.5'
          --with 'polars==1.42.0'
          --with 'niquests>=3.18.4'
          --with 'python-dotenv>=1.2.1'
          --with 'pyyaml>=6.0.3'
          --with 'rich>=14.2.0'
          --with 'tqdm>=4.67.3'
          --with 'typer>=0.20.0'
          python -c
          'import biomodals.app.design.ligandmpnn_app;
          import biomodals.workflow.ppiflow.ligandmpnn_runtime'
